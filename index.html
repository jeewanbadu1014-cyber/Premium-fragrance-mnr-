
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<meta name="description" content="Premium Fragrance MNR - Discover your favourite fragrances in Mahendranagar, Kanchanpur.">
<title>Premium Fragrance MNR | Mahendranagar</title>

<style>
:root{
 --bg:#0e0e0f;
 --panel:#19191b;
 --gold:#d7b66a;
 --muted:#aaa;
 --line:#303034;
 --white:#f7f4ed;
}
*{box-sizing:border-box}
body{
 margin:0;
 background:var(--bg);
 color:var(--white);
 font-family:Arial,Helvetica,sans-serif;
}
body.viewer-open{overflow:hidden}

header{
 background:linear-gradient(135deg,#111,#292319);
 border-bottom:1px solid #4b4029;
 padding:25px 16px;
 text-align:center;
}
.brand{
 font-family:Georgia,serif;
 letter-spacing:2px;
 color:var(--gold);
 font-size:24px;
 font-weight:bold;
}
.sub{
 font-size:11px;
 letter-spacing:2px;
 color:#ddd;
 margin-top:7px;
}
.tag{
 font-size:13px;
 color:#c9c0ad;
 margin-top:12px;
}
.wrap{
 max-width:1100px;
 margin:auto;
 padding:18px 14px 50px;
}
.tools{
 display:flex;
 gap:9px;
 flex-wrap:wrap;
 margin:12px 0 18px;
}
input,select,button{
 font:inherit;
 border-radius:9px;
 border:1px solid var(--line);
 padding:12px;
 background:#19191b;
 color:white;
}
#search{flex:1;min-width:170px}
select{min-width:130px}

h2{
 font-family:Georgia,serif;
 font-weight:normal;
 color:var(--gold);
 margin:22px 0 12px;
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
 gap:13px;
}
.product{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:13px;
 overflow:hidden;
 min-width:0;
}
.image-box{
 position:relative;
 background:#f5f2ec;
 overflow:hidden;
}
.product img{
 display:block;
 width:100%;
 aspect-ratio:1/1;
 object-fit:contain;
 padding:8px;
 cursor:zoom-in;
}
.info{padding:11px}
.name{
 font-weight:bold;
 font-size:14px;
 min-height:34px;
 line-height:1.4;
}
.category{
 font-size:11px;
 color:var(--muted);
 margin:5px 0;
}
.sizes{
 color:#ddd;
 font-size:12px;
 margin:8px 0;
}
.price{
 color:var(--gold);
 font-size:19px;
 font-weight:bold;
 margin-top:7px;
}
.mrp{
 color:#888;
 text-decoration:line-through;
 font-size:12px;
 margin-left:6px;
 font-weight:normal;
}
.discount{
 display:inline-block;
 color:#7bd69a;
 background:#173323;
 padding:4px 7px;
 border-radius:5px;
 font-size:11px;
 margin-top:6px;
}
.stock{
 font-size:11px;
 margin:8px 0;
}
.available{color:#7bd69a}
.unavailable{color:#ff8585}
.wa{
 display:block;
 text-align:center;
 text-decoration:none;
 background:#197b48;
 color:white;
 padding:10px;
 border-radius:8px;
 font-size:13px;
 font-weight:bold;
 margin-top:9px;
}
.wa:active{opacity:.8}
.empty{
 color:#aaa;
 text-align:center;
 padding:35px 10px;
 grid-column:1/-1;
}
footer{
 text-align:center;
 color:#888;
 font-size:12px;
 border-top:1px solid var(--line);
 padding:22px;
 line-height:1.8;
}

/* FULL SCREEN IMAGE VIEWER */
.image-viewer{
 display:none;
 position:fixed;
 inset:0;
 z-index:99999;
 background:rgba(0,0,0,.96);
 align-items:center;
 justify-content:center;
 padding:15px;
}
.image-viewer.show{display:flex}
.image-viewer img{
 max-width:95%;
 max-height:85vh;
 width:auto;
 height:auto;
 object-fit:contain;
 cursor:zoom-in;
 transition:transform .25s ease;
}
.image-viewer img.zoomed{
 transform:scale(2);
 cursor:zoom-out;
}
.image-close{
 position:absolute;
 top:15px;
 right:18px;
 width:45px;
 height:45px;
 padding:0;
 border:0;
 border-radius:50%;
 background:#292929;
 color:white;
 font-size:28px;
 cursor:pointer;
}
.viewer-hint{
 position:absolute;
 bottom:22px;
 color:#aaa;
 font-size:12px;
 text-align:center;
}

@media(min-width:700px){
 .brand{font-size:30px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(205px,1fr))}
}
</style>
</head>

<body>

<header>
 <div class="brand">PREMIUM FRAGRANCE MNR</div>
 <div class="sub">MAHENDRANAGAR · KANCHANPUR</div>
 <div class="tag">Elegance in every spray</div>
</header>

<main class="wrap">

 <div class="tools">
  <input id="search" placeholder="Search perfume..." aria-label="Search perfumes">

  <select id="category" aria-label="Filter by category">
   <option value="">All categories</option>
   <option>Men</option>
   <option>Women</option>
   <option>Unisex</option>
   <option>Attar</option>
   <option>Other</option>
  </select>

  <select id="availability" aria-label="Filter by availability">
   <option value="">All stock</option>
   <option value="yes">In stock</option>
   <option value="no">Out of stock</option>
  </select>
 </div>

 <h2>Our Fragrance Collection</h2>

 <div id="products" class="grid">
  <div class="empty">Loading collection...</div>
 </div>

</main>

<!-- FULL SCREEN PRODUCT IMAGE -->
<div class="image-viewer" id="imageViewer" onclick="closeImage()">
 <button class="image-close" type="button"
         aria-label="Close image"
         onclick="event.stopPropagation();closeImage()">×</button>

 <img id="largeImage"
      src=""
      alt="Enlarged perfume photo"
      onclick="event.stopPropagation();this.classList.toggle('zoomed')">

 <div class="viewer-hint">Tap image to zoom · Tap outside to close</div>
</div>

<footer>
 Premium Fragrance MNR · Mahendranagar, Kanchanpur<br>
 For orders and enquiries, contact us on WhatsApp.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// SUPABASE CONNECTION
const SUPABASE_URL = "https://zsuqakuaivxqljqzfnpc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_aKsyVEwL6wRKN8QRV-Yt_A_m8fZMtfd";
const WHATSAPP_NUMBER = "9779767681713";

const clientReady =
 SUPABASE_URL.startsWith("https://") &&
 !SUPABASE_ANON_KEY.startsWith("PASTE_") &&
 !SUPABASE_URL.startsWith("PASTE_");

const db = clientReady
 ? window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)
 : null;

let products = [];

const $ = id => document.getElementById(id);

const money = n =>
 "Rs. " + Number(n || 0).toLocaleString("en-IN");

function safe(s){
 return String(s ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

// SUPPORT SIZES STORED AS AN ARRAY OR TEXT
function getSizes(p){
 if(Array.isArray(p.sizes)){
  return p.sizes.filter(Boolean);
 }
 if(typeof p.sizes==="string"){
  return p.sizes.split(",").map(s=>s.trim()).filter(Boolean);
 }
 return [];
}

// WHATSAPP ORDER LINK
function waLink(p){
 const sizes=getSizes(p);
 const sizeText=sizes.length
  ? " Available size: "+sizes.join(", ")
  : "";

 const msg=encodeURIComponent(
  `Namaste! I am interested in ${p.name} (${money(p.price)}).${sizeText} Is it available?`
 );

 return `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;
}

// IMAGE VIEWER
function openImage(src){
 const viewer=$("imageViewer");
 const image=$("largeImage");

 image.src=src;
 image.classList.remove("zoomed");

 viewer.classList.add("show");
 document.body.classList.add("viewer-open");
}

function closeImage(){
 $("imageViewer").classList.remove("show");
 $("largeImage").classList.remove("zoomed");
 document.body.classList.remove("viewer-open");
}

document.addEventListener("keydown",function(e){
 if(e.key==="Escape")closeImage();
});

// DISPLAY PRODUCTS
function render(){

 const q=$("search").value.toLowerCase().trim();
 const cat=$("category").value;
 const av=$("availability").value;

 const filtered=products.filter(p=>
  (p.name||"").toLowerCase().includes(q) &&
  (!cat || p.category===cat) &&
  (!av || (av==="yes" ? p.in_stock : !p.in_stock))
 );

 $("products").innerHTML=filtered.length
 ? filtered.map(p=>{

  const sizes=getSizes(p);
  const hasDiscount=p.mrp && Number(p.mrp)>Number(p.price);

  const discount=hasDiscount
   ? Math.round((Number(p.mrp)-Number(p.price))/Number(p.mrp)*100)
   : 0;

  const image=p.image_url ||
   "https://placehold.co/600x600/f5f2ec/333?text=Perfume";

  return `
   <article class="product">

    <div class="image-box">
     <img
      src="${safe(image)}"
      alt="${safe(p.name)}"
      loading="lazy"
      onclick="openImage(this.src)"
      onerror="this.onerror=null;this.src='https://placehold.co/600x600/f5f2ec/333?text=No+Image'"
     >
    </div>

    <div class="info">

     <div class="name">${safe(p.name)}</div>

     <div class="category">${safe(p.category||"Other")}</div>

     ${sizes.length
      ? `<div class="sizes">Size: ${sizes.map(s=>safe(s)).join(" · ")}</div>`
      : ""
     }

     <div class="price">
      ${money(p.price)}
      ${hasDiscount
       ? `<span class="mrp">${money(p.mrp)}</span>`
       : ""
      }
     </div>

     ${discount
      ? `<div class="discount">${discount}% OFF</div>`
      : ""
     }

     <div class="stock ${p.in_stock?"available":"unavailable"}">
      ${p.in_stock?"● In Stock":"● Out of Stock"}
     </div>

     ${p.in_stock
      ? `<a class="wa" href="${waLink(p)}" target="_blank" rel="noopener">Order on WhatsApp</a>`
      : `<span class="note">Currently unavailable</span>`
     }

    </div>
   </article>
  `;
 }).join("")
 : '<div class="empty">No perfumes found. Please check again later.</div>';
}

// LOAD FROM SUPABASE
async function loadProducts(){

 if(!db){
  $("products").innerHTML=
   '<div class="empty">Website setup is not finished. Please check the Supabase connection.</div>';
  return;
 }

 $("products").innerHTML=
  '<div class="empty">Loading collection...</div>';

 const {data,error}=await db
  .from("products")
  .select("*")
  .order("created_at",{ascending:false});

 if(error){
  $("products").innerHTML=
   '<div class="empty">Could not load products. Please try again later.</div>';

  console.error("Supabase error:",error);
  return;
 }

 products=data||[];
 render();
}

// SEARCH AND FILTERS
$("search").addEventListener("input",render);
$("category").addEventListener("change",render);
$("availability").addEventListener("change",render);

// START WEBSITE
loadProducts();

</script>
</body>
 </html>
